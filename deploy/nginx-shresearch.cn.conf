# Static site for shresearch.cn (Next.js static export)
# Deploy target: /var/www/shresearch.cn/current (atomic release symlink)

server {
    listen 80;
    listen [::]:80;
    server_name shresearch.cn www.shresearch.cn;

    root /var/www/shresearch.cn/current;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://www.shresearch.cn$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name shresearch.cn;

    ssl_certificate /etc/letsencrypt/live/shresearch.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shresearch.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    return 301 https://www.shresearch.cn$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.shresearch.cn;

    ssl_certificate /etc/letsencrypt/live/shresearch.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shresearch.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /var/www/shresearch.cn/current;
    index index.html;

    # AI News Radar: served statically from /var/www/ai-radar
    # (synced by the ai-news-radar repo's GitHub Actions -> VPS workflow).
    location = /ai-radar {
        return 301 /ai-radar/;
    }

    location ^~ /ai-radar/assets/ {
        alias /var/www/ai-radar/assets/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    location ^~ /ai-radar/ {
        alias /var/www/ai-radar/;
        index index.html;
        try_files $uri $uri/ =404;

        gzip on;
        gzip_types application/json application/javascript text/javascript text/css text/xml application/xml;

        sub_filter_once on;
        sub_filter '</body>' '<a class="sr-back-home" href="/" aria-label="返回首页导航">← <span>返回首页导航</span></a><style>.sr-back-home{position:fixed;z-index:9999;left:20px;top:18px;display:inline-flex;align-items:center;gap:10px;padding:14px 20px;border:2px solid #a78bfa;border-radius:12px;background:#6d4aff;color:#fff;text-decoration:none;font:800 15px/1 system-ui,-apple-system,"PingFang SC",sans-serif;box-shadow:0 8px 30px rgba(109,74,255,.55);letter-spacing:.02em}.sr-back-home:hover{background:#7c5cff;box-shadow:0 10px 38px rgba(109,74,255,.7);transform:translateY(-1px)}@media(max-width:640px){.sr-back-home{left:12px;top:12px;padding:12px 15px;font-size:13px}}</style></body>';

        add_header Cache-Control "public, max-age=300, stale-while-revalidate=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, max-age=300, stale-while-revalidate=86400" always;
}
