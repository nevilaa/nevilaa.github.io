# Static site for shresearch.cn (Next.js static export)
# Deploy target: /var/www/shresearch.cn/current (atomic release symlink)

server {
    listen 80;
    listen [::]:80;
    server_name shresearch.cn www.shresearch.cn;

    root /var/www/shresearch.cn/current;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name shresearch.cn www.shresearch.cn;

    ssl_certificate /etc/letsencrypt/live/shresearch.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shresearch.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /var/www/shresearch.cn/current;
    index index.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, max-age=300, stale-while-revalidate=86400" always;
}
